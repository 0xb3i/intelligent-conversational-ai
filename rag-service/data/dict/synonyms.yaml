# BM25 查询同义词扩展词表
# 在 InvertedIndex.search 时，每个 query token 若命中此处的某条目（任意一边），
# 会把该组所有词都加入 query_tokens（OR 扩展）。
# 注：扩展只影响"哪些词项参与 BM25 计算"，不改 BM25 公式本身。
#
# 设计原则：
#   - 同义词组内的词在评论里大概率指同一概念
#   - 不收录强歧义词（如"服务"太泛）
#   - 不需要把所有变体都列全，只列高频常用形式
#   - 词典里若已加为复合词的（如"自助早餐"），在此扩展短形式即可

groups:
  # ── 餐饮 ──
  - [早餐, 早饭, 早点, 早膳]
  - [自助餐, 自助, buffet]
  - [自助早餐, 早餐自助]
  - [咖啡, coffee]
  - [下午茶, 茶歇]

  # ── 房间设施 ──
  - [WiFi, wifi, 无线, 无线网, 网络]
  - [空调, 中央空调, 独立空调]
  - [电视, 液晶电视, TV]
  - [冰箱, 迷你冰箱, 小冰箱]
  - [热水, 热水器, 烧水壶, 电热水壶]
  - [浴缸, 大浴缸]
  - [淋浴, 花洒, 淋浴间]
  - [马桶, 智能马桶, 卫生间]
  - [床, 大床, 双床, 床品, 床垫]
  - [枕头, 枕]
  - [被子, 被]
  - [窗户, 落地窗, 飘窗]
  - [隔音, 隔音效果]
  - [房间面积, 房间空间, 面积]
  - [房间, 客房]

  # ── 公共设施 ──
  - [泳池, 游泳池, 室内泳池, 室外泳池, 恒温泳池]
  - [健身房, 健身中心, 健身]
  - [停车场, 停车, 地下停车场]
  - [SPA, 水疗, 桑拿]
  - [儿童乐园, 儿童俱乐部, 亲子区, 亲子设施]

  # ── 服务 ──
  - [入住, check-in, checkin]
  - [退房, check-out, checkout]
  - [前台, 接待, 礼宾]
  - [打扫, 清扫, 清洁, 整理, 房间清洁]
  - [服务态度, 态度, 服务意识]
  - [叫醒, 叫醒服务]
  - [行李, 行李寄存]
  - [接送, 机场接送, 接机, 送机]

  # ── 位置 / 交通 ──
  - [地铁, 地铁站, 地铁口]
  - [公交, 公交站, 巴士]
  - [机场, 白云机场]
  - [打车, 出租车, 网约车]
  - [周边, 附近, 附近商圈]
  - [商场, 商圈, 购物中心]
  - [景点, 景区, 旅游景点]
  - [景观, 景色, 风景, 视野]
  - [江景, 河景]
  - [园景, 花园景]

  # ── 价格 ──
  - [性价比, 价比, 划算, 值得]
  - [便宜, 实惠, 划算]
  - [贵, 价格偏高, 价格虚高, 偏贵]
  - [优惠, 折扣, 打折]
  - [收费, 加收, 额外收费, 隐形消费]

  # ── 体验类 ──
  - [安静, 静音, 不吵]
  - [吵闹, 噪音, 嘈杂]
  - [干净, 整洁, 卫生, 清洁]
  - [脏, 卫生差]
  - [舒适, 舒服, 适意]
  - [满意, 推荐, 不错, 好评]
  - [失望, 差评]

  # ── 时间相关 ──
  - [最近, 近期, 最近一次]
  - [以前, 之前, 过去]
